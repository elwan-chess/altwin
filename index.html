<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة Twins التعليمية</title>
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="icon" type="image/jpeg" href="icon.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .container {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
    padding: 35px 25px;
  }
  
  .logo { text-align: center; margin-bottom: 10px; }
  
  .logo-icon {
    width: 75px; height: 75px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    color: #fff;
    margin-bottom: 12px;
    box-shadow: 0 10px 25px rgba(59,130,246,0.4);
  }
  
  h1 { text-align: center; color: #1e3a8a; font-size: 24px; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; }
  
  .free-badge {
    display: block;
    text-align: center;
    background: #dcfce7;
    color: #166534;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    width: fit-content;
    margin: 0 auto 22px;
  }
  
  .field { margin-bottom: 15px; }
  
  label {
    display: block;
    color: #334155;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
  }
  
  input, select {
    width: 100%;
    padding: 13px 15px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 15px;
    background: #f8fafc;
    transition: 0.3s;
    font-family: inherit;
  }
  
  input:focus, select:focus {
    outline: none;
    border-color: #3b82f6;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
  }
  
  .gender-group { display: flex; gap: 10px; }
  
  .gender-btn {
    flex: 1;
    padding: 14px;
    border: 2px solid #e2e8f0;
    background: #f8fafc;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
    color: #64748b;
  }
  
  .gender-btn.selected {
    border-color: #3b82f6;
    background: linear-gradient(135deg, #dbeafe, #eff6ff);
    color: #1e40af;
    transform: scale(1.02);
  }
  
  .btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
    font-family: inherit;
  }
  
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(59,130,246,0.4); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  
  .support-btn {
    display: block;
    text-align: center;
    margin-top: 18px;
    padding: 12px;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 4px 12px rgba(34,197,94,0.3);
  }
  
  .support-btn:hover { transform: translateY(-2px); }
  .support-btn.hidden { display: none; }
  
  .msg {
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
  }
  
  .msg.error { background: #fee2e2; color: #991b1b; display: block; }
  .msg.success { background: #dcfce7; color: #166534; display: block; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="logo-icon">👥</div>
    <h1>منصة Twins</h1>
    <p class="subtitle">منصة تعليمية متكاملة</p>
  </div>
  
  <span class="free-badge">✨ مجانية بالكامل</span>
  
  <form id="loginForm">
    <div class="field">
      <label>رقم الطالب</label>
      <input type="tel" id="studentId" placeholder="ادخل رقم الطالب" required>
    </div>
    
    <div class="field">
      <label>رقم ولي الأمر</label>
      <input type="tel" id="parentPhone" placeholder="ادخل رقم ولي الأمر" required>
    </div>
    
    <div class="field">
      <label>اسم الطالب</label>
      <input type="text" id="studentName" placeholder="ادخل اسم الطالب" required>
    </div>
    
    <div class="field">
      <label>النوع</label>
      <div class="gender-group">
        <button type="button" class="gender-btn" id="btnBoy" onclick="selectGender('male')">👦 ولد</button>
        <button type="button" class="gender-btn" id="btnGirl" onclick="selectGender('female')">👧 بنت</button>
      </div>
    </div>
    
    <div class="field">
      <label>المرحلة التعليمية</label>
      <select id="grade" required>
        <option value="">اختر المرحلة</option>
        <option value="sec2">تانية بكالوريا</option>
        <option value="sec3">تالتة ثانوي</option>
      </select>
    </div>
    
    <div class="field">
      <label>كود السنتر</label>
      <input type="text" id="centerCode" placeholder="ادخل كود السنتر" required>
    </div>
    
    <button type="submit" class="btn" id="submitBtn">دخول المنصة</button>
    <div class="msg" id="msg"></div>
  </form>
  
  <a href="#" class="support-btn hidden" id="supportBtn" target="_blank">
    💬 تواصل مع الدعم الفني على واتساب
  </a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyACH2wbuP9VmpfmZIXj5He8c4FWzYLNqk4",
    authDomain: "altwin-ea6c9.firebaseapp.com",
    projectId: "altwin-ea6c9",
    storageBucket: "altwin-ea6c9.firebasestorage.app",
    messagingSenderId: "728148068456",
    appId: "1:728148068456:web:edc9628e10b27d8eef53dd"
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  
  let selectedGender = '';
  
  async function loadSupportPhone() {
    try {
      const snap = await getDoc(doc(db, 'settings', 'support'));
      if (snap.exists() && snap.data().whatsapp) {
        const phone = snap.data().whatsapp;
        const supportBtn = document.getElementById('supportBtn');
        supportBtn.href = `https://wa.me/${phone}?text=${encodeURIComponent('مرحباً، عندي مشكلة في منصة Twins')}`;
        supportBtn.classList.remove('hidden');
      }
    } catch (err) {
      console.log('لا يوجد رقم دعم بعد');
    }
  }
  
  loadSupportPhone();
  
  window.selectGender = function(g) {
    selectedGender = g;
    document.getElementById('btnBoy').classList.remove('selected');
    document.getElementById('btnGirl').classList.remove('selected');
    if (g === 'male') document.getElementById('btnBoy').classList.add('selected');
    else document.getElementById('btnGirl').classList.add('selected');
  };
  
  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!selectedGender) {
      showMsg('⚠️ من فضلك اختر النوع', 'error');
      return;
    }
    
    btn.disabled = true;
    btn.textContent = 'جاري التحقق...';
    
    const studentId = document.getElementById('studentId').value.trim();
    const parentPhone = document.getElementById('parentPhone').value.trim();
    const studentName = document.getElementById('studentName').value.trim();
    const grade = document.getElementById('grade').value;
    const centerCode = document.getElementById('centerCode').value.trim();
    
    const VALID_CENTER_CODE = "TWIN2025";
    
    if (centerCode !== VALID_CENTER_CODE) {
      showMsg('❌ كود السنتر غير صحيح', 'error');
      btn.disabled = false;
      btn.textContent = 'دخول المنصة';
      return;
    }
    
    try {
      const studentRef = doc(db, 'students', studentId);
      const studentSnap = await getDoc(studentRef);
      
      const data = {
        studentId, parentPhone, studentName,
        gender: selectedGender,
        grade, centerCode,
        lastLogin: new Date().toISOString()
      };
      
      if (studentSnap.exists()) {
        await setDoc(studentRef, data, { merge: true });
      } else {
        await setDoc(studentRef, {
          ...data,
          createdAt: new Date().toISOString(),
          completedLessons: [],
          examResults: []
        });
      }
      
      localStorage.setItem('studentId', studentId);
      localStorage.setItem('studentName', studentName);
      localStorage.setItem('grade', grade);
      localStorage.setItem('gender', selectedGender);
      localStorage.setItem('parentPhone', parentPhone);
      
      showMsg('✅ تم الدخول بنجاح! جاري التحويل...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
      
    } catch (err) {
      console.error(err);
      showMsg('❌ حصل خطأ، جرب تاني', 'error');
      btn.disabled = false;
      btn.textContent = 'دخول المنصة';
    }
  });
</script>

</body>
</html>
